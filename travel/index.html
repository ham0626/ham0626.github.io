          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
* { box-sizing: border-box; }

.travel-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 10px;
}

.map-wrapper {
    flex: 2.5;
    min-width: 320px;
    height: 600px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}

#map { width: 100%; height: 100%; }

.info-panel {
    flex: 1.5;
    min-width: 260px;
    background: #f8f9fa;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    max-height: 600px;
    overflow-y: auto;
    transition: all 0.2s;
}

.info-panel .placeholder {
    color: #aaa;
    text-align: center;
    font-size: 16px;
    margin-top: 40%;
}

.city-name {
    font-size: 28px;
    font-weight: 700;
    color: #222;
    margin-bottom: 16px;
    border-bottom: 3px solid #4CAF50;
    padding-bottom: 8px;
}

.spot-item {
    background: white;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: 0.2s;
    display: flex;
    gap: 14px;
    align-items: flex-start;
}

.spot-item:hover { background: #f0f0f0; }

.spot-img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
}

.spot-info {
    flex: 1;
}
.spot-info .spot-name {
    font-weight: 600;
    font-size: 16px;
    color: #222;
}
.spot-info .spot-desc {
    font-size: 14px;
    color: #666;
    margin-top: 4px;
}

@media (max-width: 700px) {
    .travel-container { flex-direction: column; }
    .map-wrapper { height: 400px; }
    .info-panel { max-height: 400px; }
    .spot-item { flex-direction: column; align-items: center; }
    .spot-img { width: 100%; height: 120px; }
}
</style>

<p style="margin-bottom: 16px; color: #555;">点击地图上的标记，查看该城市的所有景点 👇</p>

<div class="travel-container">
    <div class="map-wrapper"><div id="map"></div></div>
    <div class="info-panel" id="infoPanel">
        <div class="placeholder">👆 点击图钉<br>查看城市景点</div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

    // ========== 景点数据（按城市分组） ==========
    // 每个景点必须包含 city（城市名）、name（景点名）、lat、lng、desc、img
    var spots = [
        // --- 巴黎 ---
        {
            city: "巴黎",
            name: "埃菲尔铁塔",
            lat: 48.8584, lng: 2.2945,
            desc: "浪漫之都的象征，夜景璀璨。",
            img: "https://picsum.photos/seed/eiffel/400/300"
        },
        {
            city: "巴黎",
            name: "卢浮宫",
            lat: 48.8606, lng: 2.3376,
            desc: "世界四大博物馆之一，藏品无数。",
            img: "https://picsum.photos/seed/louvre/400/300"
        },
        // --- 东京 ---
        {
            city: "东京",
            name: "浅草寺",
            lat: 35.7148, lng: 139.7967,
            desc: "东京最古老的寺庙，江户风情。",
            img: "https://picsum.photos/seed/asakusa/400/300"
        },
        {
            city: "东京",
            name: "东京塔",
            lat: 35.6586, lng: 139.7454,
            desc: "东京地标，俯瞰都市夜景。",
            img: "https://picsum.photos/seed/tokyotower/400/300"
        },
        // --- 纽约 ---
        {
            city: "纽约",
            name: "时代广场",
            lat: 40.7580, lng: -73.9855,
            desc: "世界的十字路口，永不眠。",
            img: "https://picsum.photos/seed/timessquare/400/300"
        },
        {
            city: "纽约",
            name: "中央公园",
            lat: 40.7829, lng: -73.9654,
            desc: "曼哈顿的绿肺，城市中的自然。",
            img: "https://picsum.photos/seed/centralpark/400/300"
        },
        // --- 悉尼 ---
        {
            city: "悉尼",
            name: "悉尼歌剧院",
            lat: -33.8568, lng: 151.2153,
            desc: "南半球的地标，海滨帆影。",
            img: "https://picsum.photos/seed/opera/400/300"
        },
        {
            city: "悉尼",
            name: "邦迪海滩",
            lat: -33.8915, lng: 151.2767,
            desc: "悉尼最著名的海滩，冲浪天堂。",
            img: "https://picsum.photos/seed/bondi/400/300"
        },
        // --- 开普敦 ---
        {
            city: "开普敦",
            name: "桌山",
            lat: -33.9249, lng: 18.4241,
            desc: "上帝的餐桌，俯瞰南非。",
            img: "https://picsum.photos/seed/tablemountain/400/300"
        },
        {
            city: "开普敦",
            name: "好望角",
            lat: -34.3581, lng: 18.4718,
            desc: "非洲大陆最西南端，大洋交汇。",
            img: "https://picsum.photos/seed/capepoint/400/300"
        },
        // --- 伦敦 ---
        {
            city: "伦敦",
            name: "大本钟",
            lat: 51.5007, lng: -0.1246,
            desc: "英国政治与历史的象征。",
            img: "https://picsum.photos/seed/bigben/400/300"
        },
        {
            city: "伦敦",
            name: "伦敦塔桥",
            lat: 51.5055, lng: -0.0754,
            desc: "泰晤士河上的标志性开合桥。",
            img: "https://picsum.photos/seed/towerbridge/400/300"
        }
    ];

       // ========== 初始化地图 ==========
    var map = L.map('map').setView([20, 0], 2);

    // 图源1：高德地图（普通街道图，国内稳定）
    var tileLayer1 = L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
        maxZoom: 18,
        attribution: '© 高德地图'
    }).addTo(map);

    // 图源2：高德地图（卫星图，备选）
    var tileLayer2 = L.tileLayer('https://webst01.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
        maxZoom: 18,
        attribution: '© 高德地图'
    });

    // 图源3：腾讯地图（备选）
    var tileLayer3 = L.tileLayer('https://rt0.map.gtimg.com/tile?z={z}&x={x}&y={y}&styleid=3&version=118', {
        maxZoom: 18,
        attribution: '© 腾讯地图'
    });

    // 检测高德是否加载成功，失败则切换
    var loaded = false;
    tileLayer1.on('load', function() { loaded = true; });
    tileLayer1.on('tileerror', function() {
        if (!loaded) {
            map.removeLayer(tileLayer1);
            tileLayer2.addTo(map);
            tileLayer2.on('tileerror', function() {
                map.removeLayer(tileLayer2);
                tileLayer3.addTo(map);
            });
        }
    });

    // 5秒后强制切换（防止卡死）
    setTimeout(function() {
        if (!loaded) {
            map.removeLayer(tileLayer1);
            tileLayer2.addTo(map);
            setTimeout(function() {
                if (!map.hasLayer(tileLayer2)) {
                    tileLayer3.addTo(map);
                }
            }, 3000);
        }
    }, 5000);

    // ========== 添加标记 ==========
    var redIcon = L.icon({
        iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41]
    });

    // 为每个景点创建一个标记
    spots.forEach(function(spot) {
        var marker = L.marker([spot.lat, spot.lng], { icon: redIcon }).addTo(map);

        marker.on('click', function() {
            // 找出该城市的所有景点
            var citySpots = spots.filter(s => s.city === spot.city);
            renderCity(spot.city, citySpots);
        });
    });

    // ========== 渲染右侧面板 ==========
    function renderCity(cityName, spotsList) {
        var html = `<div class="city-name">📍 ${cityName}</div>`;
        spotsList.forEach(function(s) {
            html += `
                <div class="spot-item">
                    <img class="spot-img" src="${s.img}" alt="${s.name}" onerror="this.src='https://picsum.photos/400/300?random=1'">
                    <div class="spot-info">
                        <div class="spot-name">${s.name}</div>
                        <div class="spot-desc">${s.desc}</div>
                    </div>
                </div>
            `;
        });
        document.getElementById('infoPanel').innerHTML = html;
        // 滚动到顶部
        document.getElementById('infoPanel').scrollTop = 0;
    }

    // 自适应视野
    var group = L.featureGroup(
        spots.map(function(s) {
            return L.marker([s.lat, s.lng]);
        })
    );
    map.fitBounds(group.getBounds().pad(0.2));

});
</script>
