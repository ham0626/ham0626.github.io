<style>
* { box-sizing: border-box; }

.travel-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 20px;
}

.map-wrapper {
    flex: 2;
    min-width: 300px;
    height: 500px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}

#map {
    width: 100%;
    height: 100%;
}

.info-panel {
    flex: 1;
    min-width: 220px;
    background: #f8f9fa;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: all 0.3s ease;
    min-height: 300px;
}

.info-panel .placeholder {
    color: #999;
    text-align: center;
    font-size: 16px;
}

.info-panel .place-name {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 6px;
    color: #222;
}

.info-panel .place-desc {
    font-size: 15px;
    color: #555;
    margin-bottom: 12px;
    line-height: 1.6;
}

.info-panel .place-img {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

@media (max-width: 700px) {
    .travel-container { flex-direction: column; }
    .map-wrapper { height: 380px; }
    .info-panel { min-height: 180px; }
}
</style>

<h2>🌍 足迹地图</h2>
<p>点击地图上的标记，查看对应地点信息 👇</p>

<div class="travel-container">
    <div class="map-wrapper">
        <div id="map"></div>
    </div>
    <div class="info-panel" id="infoPanel">
        <div class="placeholder">👆 点击地图上的图钉<br>查看详情</div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

    // ========== 你的全球地点数据 ==========
    // 注意：不要填写出生地或上学地，只写你想去或有意义的地方
    var locations = [
        {
            name: "巴黎 · 埃菲尔铁塔",
            lat: 48.8584,
            lng: 2.2945,
            desc: "浪漫之都的象征，夜景璀璨。",
            img: "https://picsum.photos/seed/paris/600/400"
        },
        {
            name: "东京 · 浅草寺",
            lat: 35.7148,
            lng: 139.7967,
            desc: "东京最古老的寺庙，感受江户风情。",
            img: "https://picsum.photos/seed/tokyo/600/400"
        },
        {
            name: "纽约 · 时代广场",
            lat: 40.7580,
            lng: -73.9855,
            desc: "世界的十字路口，永不眠的城市。",
            img: "https://picsum.photos/seed/nyc/600/400"
        },
        {
            name: "悉尼 · 歌剧院",
            lat: -33.8568,
            lng: 151.2153,
            desc: "南半球的地标，海滨帆影。",
            img: "https://picsum.photos/seed/sydney/600/400"
        },
        {
            name: "开普敦 · 桌山",
            lat: -33.9249,
            lng: 18.4241,
            desc: "上帝的餐桌，俯瞰南非。",
            img: "https://picsum.photos/seed/capetown/600/400"
        },
        {
            name: "里约 · 基督像",
            lat: -22.9519,
            lng: -43.2105,
            desc: "世界新七大奇迹之一。",
            img: "https://picsum.photos/seed/rio/600/400"
        },
        {
            name: "伦敦 · 大本钟",
            lat: 51.5007,
            lng: -0.1246,
            desc: "英国政治与历史的象征。",
            img: "https://picsum.photos/seed/london/600/400"
        }
        // ===== 你可以继续加，格式同上 =====
    ];

    // ========== 初始化地图，视野设为全球 ==========
    var map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // ========== 自定义图钉 ==========
    var redIcon = L.icon({
        iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41]
    });

    // ========== 添加标记 ==========
    locations.forEach(function(loc) {
        var marker = L.marker([loc.lat, loc.lng], { icon: redIcon }).addTo(map);

        // 点击时更新右侧面板
        marker.on('click', function() {
            document.getElementById('infoPanel').innerHTML = `
                <div class="place-name">${loc.name}</div>
                <div class="place-desc">${loc.desc}</div>
                <img class="place-img" src="${loc.img}" alt="${loc.name}" onerror="this.src='https://picsum.photos/600/400?random=1'">
            `;
        });
    });

    // 让地图自动适应所有标记的范围，并保留全球视野（如果标记分散的话）
    var group = L.featureGroup(
        locations.map(function(loc) {
            return L.marker([loc.lat, loc.lng]);
        })
    );
    map.fitBounds(group.getBounds().pad(0.3));

});
</script>
